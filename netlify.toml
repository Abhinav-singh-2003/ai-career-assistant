[build]
base = "."
command = "npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix backend && npm run build --prefix frontend"
publish = "frontend/dist"
functions = "backend/netlify/functions"

[build.environment]
NODE_VERSION = "22.14.0"
VITE_API_URL = "/api"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/api"
to = "/.netlify/functions/api"
status = 200

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
